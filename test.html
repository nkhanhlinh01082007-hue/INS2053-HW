<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#ffdce9">
	<title>Khánh Linh có xinh không?</title>
	<style>
		:root {
			color-scheme: light;
			--pink: #eb5d99;
			--berry: #9e2c62;
			--ink: #53223d;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			min-height: 100svh;
			margin: 0;
			overflow: hidden;
			color: var(--ink);
			background-color: #ffeaf2;
			background-image:
				radial-gradient(ellipse at 12% 14%, #ffc3dd 0, transparent 34%),
				radial-gradient(ellipse at 88% 86%, #f7bad8 0, transparent 36%),
				radial-gradient(#fff9fc 1.5px, transparent 1.5px);
			background-size: auto, auto, 28px 28px;
			font-family: "Trebuchet MS", sans-serif;
		}

		.intro {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			padding: 28px 18px;
			text-align: center;
			transition: opacity 600ms ease, transform 700ms ease;
		}

		.intro-content {
			width: min(100%, 860px);
			animation: appear 700ms cubic-bezier(.2, .8, .2, 1) both;
		}

		.princess-parade {
			display: flex;
			justify-content: center;
			align-items: end;
			gap: clamp(3px, 3vw, 26px);
			min-height: 120px;
			margin-bottom: 4px;
		}

		.princess {
			display: inline-block;
			font-size: clamp(48px, 10vw, 82px);
			line-height: 1.2;
			transform-origin: center bottom;
			animation: dance var(--speed, 700ms) ease-in-out infinite alternate;
			animation-delay: var(--delay, 0ms);
			filter: drop-shadow(0 8px 5px #a6386620);
			user-select: none;
		}

		.princess:nth-child(even) { --speed: 540ms; }
		.princess:nth-child(3n) { --speed: 860ms; }

		h1 {
			max-width: 760px;
			margin: 10px auto 28px;
			color: var(--berry);
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(36px, 8vw, 68px);
			font-weight: 700;
			line-height: 1.1;
			text-wrap: balance;
			text-shadow: 0 3px 0 #fff;
		}

		.choices {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 18px;
			min-height: 58px;
		}

		button {
			min-width: 112px;
			min-height: 52px;
			padding: 12px 24px;
			border: 0;
			border-radius: 999px;
			font: 700 18px "Trebuchet MS", sans-serif;
			cursor: pointer;
			touch-action: manipulation;
			transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
		}

		#yes {
			color: #fff;
			background: var(--pink);
			box-shadow: 0 6px 16px #c4436b35;
		}

		#yes:hover { transform: translateY(-3px) scale(1.05); background: #d84886; }

		#no {
			color: var(--berry);
			background: #fff;
			box-shadow: 0 5px 14px #9d31501a;
		}

		#no.evading { position: fixed; z-index: 3; }

		.sparkle {
			position: absolute;
			color: #e34f91;
			font-size: clamp(22px, 4vw, 38px);
			pointer-events: none;
			animation: twinkle 1.1s ease-in-out infinite alternate;
		}

		.sparkle-one { top: 12%; left: 12%; }
		.sparkle-two { top: 19%; right: 12%; animation-delay: 350ms; }
		.sparkle-three { right: 17%; bottom: 13%; animation-delay: 650ms; }
		.sparkle-four { bottom: 18%; left: 14%; animation-delay: 180ms; }

		.universe {
			position: fixed;
			inset: 0;
			display: grid;
			place-items: center;
			overflow: hidden;
			background:
				radial-gradient(ellipse at 50% 48%, #381751 0, #170d31 45%, #080817 100%);
			opacity: 0;
			visibility: hidden;
			transition: opacity 1s ease, visibility 1s;
		}

		#starfield {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
		}

		.universe-message {
			position: relative;
			z-index: 1;
			margin: min(54vh, 390px) 18px 0;
			color: #fff1fa;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(20px, 4vw, 32px);
			text-align: center;
			text-shadow: 0 0 18px #f57ebd;
			opacity: 0;
			transform: translateY(10px);
			transition: opacity 900ms ease 450ms, transform 900ms ease 450ms;
		}

		body.show-universe .intro {
			opacity: 0;
			transform: scale(1.06);
			pointer-events: none;
		}

		body.show-universe .universe {
			opacity: 1;
			visibility: visible;
		}

		body.show-universe .universe-message {
			opacity: 1;
			transform: translateY(0);
		}

		@keyframes appear {
			from { opacity: 0; transform: translateY(12px) scale(.97); }
			to { opacity: 1; transform: translateY(0) scale(1); }
		}

		@keyframes dance {
			from { transform: translateY(4px) rotate(-9deg) scale(.96); }
			to { transform: translateY(-22px) rotate(10deg) scale(1.06); }
		}

		@keyframes twinkle {
			from { transform: scale(.72) rotate(-14deg); opacity: .45; }
			to { transform: scale(1.2) rotate(14deg); opacity: 1; }
		}

		@media (max-width: 520px) {
			.princess-parade { gap: 2px; min-height: 94px; }
			.princess { font-size: clamp(42px, 13vw, 65px); }
			h1 { margin-bottom: 24px; }
			.sparkle-one { left: 5%; }
			.sparkle-two { right: 5%; }
			.sparkle-three { right: 7%; }
			.sparkle-four { left: 6%; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation-duration: .01ms !important;
				animation-iteration-count: 1 !important;
				transition-duration: .01ms !important;
			}
		}
	</style>
</head>
<body>
	<section class="intro" aria-label="Câu hỏi dành cho Khánh Linh">
		<span class="sparkle sparkle-one" aria-hidden="true">✦</span>
		<span class="sparkle sparkle-two" aria-hidden="true">✧</span>
		<span class="sparkle sparkle-three" aria-hidden="true">♥</span>
		<span class="sparkle sparkle-four" aria-hidden="true">✦</span>

		<main class="intro-content">
			<div class="princess-parade" aria-label="Các nàng công chúa đang nhảy múa">
				<span class="princess" style="--delay: -220ms" aria-hidden="true">👸🏻</span>
				<span class="princess" style="--delay: -80ms" aria-hidden="true">👸🏼</span>
				<span class="princess" style="--delay: -360ms" aria-hidden="true">👸🏽</span>
				<span class="princess" style="--delay: -140ms" aria-hidden="true">👸🏻</span>
				<span class="princess" style="--delay: -410ms" aria-hidden="true">👸🏼</span>
			</div>
			<h1>Khánh Linh có xinh không</h1>
			<div class="choices" aria-label="Chọn câu trả lời">
				<button id="yes" type="button">Có</button>
				<button id="no" type="button">Không</button>
			</div>
		</main>
	</section>

	<section class="universe" aria-label="Vũ trụ trái tim">
		<canvas id="starfield" aria-hidden="true"></canvas>
		<p class="universe-message">Khánh Linh xinh nhất vũ trụ! 💖</p>
	</section>

	<script>
		const noButton = document.querySelector("#no");
		const yesButton = document.querySelector("#yes");
		const canvas = document.querySelector("#starfield");
		const context = canvas.getContext("2d");
		const stars = [];
		const backgroundStars = [];
		let width = 0;
		let height = 0;
		let animationStarted = false;

		function dodgeNoButton() {
			const buttonRect = noButton.getBoundingClientRect();
			const padding = 12;
			const maxLeft = Math.max(padding, window.innerWidth - buttonRect.width - padding);
			const maxTop = Math.max(padding, window.innerHeight - buttonRect.height - padding);
			noButton.classList.add("evading");
			noButton.style.left = `${padding + Math.random() * (maxLeft - padding)}px`;
			noButton.style.top = `${padding + Math.random() * (maxTop - padding)}px`;
		}

		function resizeCanvas() {
			const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
			width = window.innerWidth;
			height = window.innerHeight;
			canvas.width = Math.round(width * pixelRatio);
			canvas.height = Math.round(height * pixelRatio);
			context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
			backgroundStars.length = 0;
			const count = Math.floor((width * height) / 7000);
			for (let index = 0; index < count; index += 1) {
				backgroundStars.push({
					x: Math.random() * width,
					y: Math.random() * height,
					radius: Math.random() * 1.6 + 0.4,
					phase: Math.random() * Math.PI * 2
				});
			}
		}

		function createHeartStars() {
			const pointCount = 150;
			for (let index = 0; index < pointCount; index += 1) {
				const angle = (index / pointCount) * Math.PI * 2;
				const sine = Math.sin(angle);
				stars.push({
					x: 16 * sine * sine * sine,
					y: 13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle),
					phase: Math.random() * Math.PI * 2,
					radius: Math.random() * 1.5 + 1.2
				});
			}
		}

		function drawUniverse(time) {
			context.clearRect(0, 0, width, height);

			for (const star of backgroundStars) {
				const alpha = 0.25 + (Math.sin(time * 0.0015 + star.phase) + 1) * 0.3;
				context.beginPath();
				context.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
				context.fillStyle = `rgba(255, 235, 251, ${alpha})`;
				context.fill();
			}

			if (stars.length === 0) return;

			const pulse = 1 + Math.pow((1 + Math.sin(time * 0.003)) / 2, 9) * 0.12;
			const scale = Math.min(width / 42, height / 49, 13) * pulse;
			const centerX = width / 2;
			const centerY = height * 0.43;
			const positions = stars.map((star) => ({
				x: centerX + star.x * scale,
				y: centerY - star.y * scale,
				alpha: 0.55 + (Math.sin(time * 0.002 + star.phase) + 1) * 0.22
			}));

			context.lineWidth = 1;
			for (let index = 0; index < positions.length; index += 1) {
				const current = positions[index];
				const next = positions[(index + 1) % positions.length];
				context.beginPath();
				context.moveTo(current.x, current.y);
				context.lineTo(next.x, next.y);
				context.strokeStyle = `rgba(255, 139, 205, ${current.alpha * 0.8})`;
				context.stroke();

				context.beginPath();
				context.arc(current.x, current.y, starSize(stars[index], time), 0, Math.PI * 2);
				context.fillStyle = `rgba(255, 244, 255, ${current.alpha})`;
				context.shadowBlur = 12;
				context.shadowColor = "#ff71c5";
				context.fill();
			}
			context.shadowBlur = 0;
			requestAnimationFrame(drawUniverse);
		}

		function starSize(star, time) {
			return star.radius * (0.85 + (Math.sin(time * 0.004 + star.phase) + 1) * 0.22);
		}

		noButton.addEventListener("pointerenter", dodgeNoButton);
		noButton.addEventListener("pointerdown", (event) => {
			event.preventDefault();
			dodgeNoButton();
		});
		noButton.addEventListener("focus", dodgeNoButton);
		noButton.addEventListener("click", (event) => {
			event.preventDefault();
			dodgeNoButton();
		});

		yesButton.addEventListener("click", () => {
			document.body.classList.add("show-universe");
			if (!animationStarted) {
				animationStarted = true;
				resizeCanvas();
				createHeartStars();
				requestAnimationFrame(drawUniverse);
			}
		});

		window.addEventListener("resize", resizeCanvas);
		resizeCanvas();
	</script>
</body>
</html>
